name: Code lint & style

on:
    push:
        branches-ignore:
            - "dependabot/**"
            - "renovate/**"
    pull_request:

permissions:
    contents: read

jobs:
    php:
        name: PHP ${{ matrix.php }}
        runs-on: ubuntu-latest
        strategy:
            matrix:
                # 8.2 tant que la prod y est : à retirer avec le passage de la plateforme Composer en 8.5
                php: ["8.2", "8.5"]

        steps:
            - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
              with:
                  php-version: ${{ matrix.php }}

            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Cache Composer packages
              id: composer-cache
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: vendor
                  key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-php-

            - name: Install PHP dependencies
              run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

            # Avis de sécurité et paquets abandonnés sur composer.lock ; une seule entrée de matrice suffit
            - name: Audit Composer dependencies
              if: matrix.php == '8.5'
              run: composer audit --locked --no-interaction

            - name: Check PHP code rules
              run: composer check-rules

    js:
        name: JavaScript
        runs-on: ubuntu-latest
        needs: php

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Use Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .nvmrc
                  cache: npm

            - name: Get PHP composer packages
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              id: composer-cache
              with:
                  path: vendor
                  key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-php-

            - name: Install JavaScript dependencies
              run: npm ci

            - name: Lint
              run: npm run lint

            - name: Format
              run: npm run format
