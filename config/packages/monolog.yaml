monolog:
    channels:
        - deprecation # Deprecations are logged in the dedicated "deprecation" channel when it exists
        - access # Ligne d'accès applicative, une par requête (voir docs/developer/logs.md)

when@dev:
    monolog:
        handlers:
            # Journal principal de dev dans un fichier rotatif.
            main:
                type: rotating_file
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug
                channels: ["!event"]
            # Affiche les logs lors de l'exécution des commandes console.
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine", "!console"]

when@test:
    monolog:
        handlers:
            # Tamponne les logs et n'écrit que si une erreur survient.
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!event"]
            # Destination de sortie du tampon de test vers un fichier.
            nested:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug

when@prod:
    monolog:
        channels:
            - deprecation

        handlers:
            # Filtre les niveaux notice à warning vers stdout (hors canaux dédiés).
            stdout_notice_warning:
                type: filter
                handler: stdout_stream
                min_level: notice
                max_level: warning
                channels: ["!deprecation", "!access"]

            # Écrit les logs opérationnels sur stdout pour Kubernetes.
            stdout_stream:
                type: stream
                path: php://stdout
                channels: ["!deprecation", "!access"]

            # Écrit les erreurs et niveaux supérieurs sur stderr.
            stderr_error_plus:
                type: stream
                path: php://stderr
                level: error
                channels: ["!deprecation", "!access"]

            # Ligne d'accès applicative : message logfmt brut sur stdout, sans décoration.
            access:
                type: stream
                path: php://stdout
                channels: [access]
                formatter: app.monolog.access_line_formatter

            # Isole les deprécations sur stderr via leur canal dédié.
            deprecation:
                type: stream
                path: php://stderr
                channels: [deprecation]

            # Gère l'affichage des logs pour les commandes console en prod.
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine", "!access"]
