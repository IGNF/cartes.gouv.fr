security:
    providers:
        # used to reload user from session & other features (e.g. switch_user)
        app_user_provider:
            id: App\Security\KeycloakUserProvider
    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        # routes d'API : jamais de redirection, un 401 Problem Details pour toute requête sans cookie valide
        api:
            pattern: "%app.api_path_pattern%"
            stateless: true
            custom_authenticators:
                - App\Security\Authenticator\CookieAuthenticator
            entry_point: App\Security\ApiAuthenticationEntryPoint
        main:
            lazy: true
            stateless: true
            # provider: app_user_provider

            # activate different ways to authenticate
            # https://symfony.com/doc/current/security.html#the-firewall
            custom_authenticators:
                - App\Security\Authenticator\CookieAuthenticator
                - App\Security\KeycloakAuthenticator
            logout:
                path: cartesgouvfr_security_logout
                # where to redirect after logout
                target: cartesgouvfr_app

            # https://symfony.com/doc/current/security/impersonating_user.html
            # switch_user: true

    # Easy way to control access for large sections of your site
    # Note: Only the *first* access control that matches will be used
    access_control:
        # formulaire de contact du site de documentation, appelé sans cookie
        - { path: ^/contact_us$, roles: PUBLIC_ACCESS }
        # documentation OpenAPI (dev)
        - { path: "%app.api_doc_path_pattern%", roles: PUBLIC_ACCESS }
        - { path: "%app.api_path_pattern%", roles: ROLE_USER }

when@test:
    security:
