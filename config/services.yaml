# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    # frontière API (regex sans délimiteurs, partagée avec security.yaml) : /contact_us reste à la racine, appelé par le site de documentation
    app.api_path_pattern: "^/(api|contact_us)(/|$)"
    # documentation OpenAPI (dev) : hors garde et hors contrôle d'accès
    app.api_doc_path_pattern: "^/api/doc(\\.json)?$"

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # même correspondance que le pare-feu (chemin décodé) pour les écouteurs qui lisent la frontière API
    app.api_path_matcher:
        class: Symfony\Component\HttpFoundation\RequestMatcher\PathRequestMatcher
        arguments: ["%app.api_path_pattern%"]

    app.api_doc_path_matcher:
        class: Symfony\Component\HttpFoundation\RequestMatcher\PathRequestMatcher
        arguments: ["%app.api_doc_path_pattern%"]

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: "../src/"
        exclude:
            - "../src/DependencyInjection/"
            - "../src/Entity/"
            - "../src/Kernel.php"
            # classe du service exception_listener de FrameworkBundle, pas un abonné de plus
            - "../src/Listener/StatusAwareErrorListener.php"

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    app.api_client.entrepot:
        class: App\ApiClient\ApiClient
        factory: ['@App\ApiClient\ApiClientFactory', "createEntrepotClient"]

    app.api_client.espaceco:
        class: App\ApiClient\ApiClient
        factory: ['@App\ApiClient\ApiClientFactory', "createEspaceCoClient"]

    app.api_client.espaceco_style:
        class: App\ApiClient\ApiClient
        factory: ['@App\ApiClient\ApiClientFactory', "createEspaceCoStyleClient"]

    # Compte de service privilégié : réservé à SandboxService, qui vérifie lui-même l'appartenance de l'utilisateur.
    # Tout autre appel amont porte le token de l'utilisateur, l'autorisation est déléguée à l'Entrepôt (cf. AGENTS.md).
    app.api_client.entrepot_sandbox_service_account:
        class: App\ApiClient\ApiClient
        factory: ['@App\ApiClient\ApiClientFactory', "createSandboxServiceAccountClient"]

    # Formatter du canal access : message logfmt seul, la ligne doit rester brute pour Loki
    app.monolog.access_line_formatter:
        class: Monolog\Formatter\LineFormatter
        arguments: ["%%message%%\n"]

imports:
    - { resource: parameters.yaml }

when@test:
    services:
        # Doubles des externes : Keycloak (client knpu remplacé) et API Entrepôt (voir framework.http_client.mock_response_factory)
        knpu.oauth2.client.keycloak:
            class: App\Tests\Double\FakeKeycloakClient
            arguments: ["@knpu.oauth2.provider.keycloak", "@request_stack"]
            calls: [[setAsStateless, []]] # comme use_state: false dans knpu_oauth2_client.yaml
            public: true # le registre du bundle le charge par identifiant
        App\Tests\Double\EntrepotMockResponseFactory: ~
