# Faux positifs Trivy ; format non auto-détecté par l'action GitHub :
# passé via --trivyignores dans .github/workflows/docker-build-publish.yml
secrets:
    # sendgrid-api-token matche les codes pays ISO 3166 de la lib "validator" minifiée par Vite (ex. SD.SE.SG.SH.SI) ; pas de SendGrid dans l'app. Scope limité au chunk validator pour ne pas masquer un vrai secret ailleurs.
    - id: sendgrid-api-token
      paths:
          - "**/public/build/assets/validator-*.js"
